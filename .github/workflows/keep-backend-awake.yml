# Render's free tier puts the backend to sleep after 15 minutes without a
# request, and the next visitor then waits over a minute for it to wake.
#
# The server keeps itself awake by pinging its own public address (see
# server/server/keep_awake.py). This workflow is the backup that wakes it if
# it ever does fall asleep, after a crash say. GitHub starts scheduled runs
# late or drops them when it is busy, which is why this is not the main
# mechanism. Run it by hand from the Actions tab with "Run workflow".
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-backend-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend health check
        run: |
          # A sleeping server can take up to a minute to answer, so allow for
          # that and retry before calling the run a failure.
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail --max-time 90 \
                https://freight-quote-generation-system-grp.onrender.com/; then
              echo
              exit 0
            fi
            echo "Attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1
