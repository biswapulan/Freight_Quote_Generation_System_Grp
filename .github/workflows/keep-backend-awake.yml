# Render's free tier puts the backend to sleep after 15 minutes without a
# request, and the next visitor then waits up to a minute for it to wake.
# This pings it on a schedule so it never goes quiet for that long.
#
# GitHub can start scheduled runs several minutes late when it is busy, so
# this runs every 5 minutes, the shortest interval GitHub allows, leaving room
# inside Render's 15-minute window. Run it by hand from the Actions tab with
# "Run workflow" to check it works.
name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-backend-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend health check
        run: |
          # A sleeping server can take up to a minute to answer, so allow for
          # that and retry before calling the run a failure.
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail --max-time 90 \
                https://freight-quote-generation-system-grp.onrender.com/; then
              echo
              exit 0
            fi
            echo "Attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1
